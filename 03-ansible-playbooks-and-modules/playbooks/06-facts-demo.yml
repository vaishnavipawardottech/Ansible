---
- name: Display managed host facts
  hosts: all
  gather_facts: true

  tasks:
    - name: Display important facts
      debug:
        msg:
          - "Inventory hostname: {{ inventory_hostname }}"
          - "System hostname: {{ ansible_hostname }}"
          - "OS family: {{ ansible_os_family }}"
          - "Distribution: {{ ansible_distribution }}"
          - "OS version: {{ ansible_distribution_version }}"
          - "Total RAM in MB: {{ ansible_memtotal_mb }}"
          - "Default IPv4: {{ ansible_default_ipv4.address | default('Not available') }}"
          - "Network interfaces: {{ ansible_interfaces }}"